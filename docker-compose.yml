services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: consapp
      MYSQL_USER: consapp
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - consapp-mysql:/var/lib/mysql

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Europe/Moscow
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: consapp
      DB_USERNAME: consapp
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

volumes:
  consapp-mysql:
