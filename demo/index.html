<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Запись на консультацию</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">Запись на консультацию</div>
  </header>
  <main>
    <div class="auth">
      <h1>Вход</h1>
      <p class="lead">Почта и пароль учётной записи.</p>
      <div class="field">
        <label for="email">Почта</label>
        <input id="email" type="email" name="email" value="sokolov@kafedra.local" autocomplete="off">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="off">
      </div>
      <p class="form-actions"><a class="btn" href="student.html">Войти</a></p>
      <p class="hint"><a href="register.html">Регистрация студента</a></p>
      <p class="hint">Кабинеты: <a href="student.html">студент</a>, <a href="teacher.html">преподаватель</a>, <a href="admin.html">администратор</a>.</p>
    </div>
  </main>
</body>
</html>
