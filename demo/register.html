<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация студента — Запись на консультацию</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">Запись на консультацию</div>
  </header>
  <main>
    <div class="auth">
      <h1>Регистрация студента</h1>
      <p class="lead">После регистрации открывается кабинет студента.</p>
      <div class="field">
        <label for="name">ФИО</label>
        <input id="name" type="text" name="name" value="Соколов Илья" autocomplete="off">
      </div>
      <div class="field">
        <label for="group">Группа</label>
        <input id="group" type="text" name="group" value="ПИ-21" autocomplete="off">
      </div>
      <div class="field">
        <label for="email">Почта</label>
        <input id="email" type="email" name="email" value="sokolov@kafedra.local" autocomplete="off">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="off">
      </div>
      <div class="field">
        <label for="password2">Повтор пароля</label>
        <input id="password2" type="password" name="password2" autocomplete="off">
      </div>
      <p class="form-actions"><a class="btn" href="student.html">Зарегистрироваться</a></p>
      <p class="hint"><a href="index.html">Вход</a></p>
    </div>
  </main>
</body>
</html>
